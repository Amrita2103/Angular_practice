<h1> user list</h1>
<ul>
    @for(user of usersData(); track user.id){
        <ul>
            <li>
                Name: {{user.name}}</li>
             <li>
                Age: {{user.age}}</li>
             <li>
                Email: {{user.email}} </li>
             <li>
                id: {{user.id}}</li>
        </ul>
    }
</ul>
